[project]
name = "agent-eval"
version = "0.1.0"
description = "Evaluation and regression-gating harness for AI agents, with fault injection to verify the suite itself"
readme = "README.md"
requires-python = ">=3.12"
# Runtime dependencies are pinned in requirements.txt, which is what CI and the
# local setup install. Duplicating them here would create two lists to keep in
# step and no mechanism to catch them drifting apart.
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools]
packages = ["app"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
# The tests import `app.*`, `dashboard`, and shell out to demo_pipeline.py, all of
# which live at the repo root. pytest only puts the test file's own directory on
# sys.path, so without this the whole suite fails to collect unless the package
# happens to be pip-installed.
pythonpath = ["."]
testpaths = ["tests"]
