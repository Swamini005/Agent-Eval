name: Agent Evaluation & CI Regression Gate

on:
  pull_request:
    branches: [ main, master ]

jobs:
  agent-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Headless Agent Evaluation Pipeline
        run: |
          python demo_pipeline.py --mode=ci

      - name: Run CI Verification Gate Check
        run: |
          python app/evaluation/gate_check.py

      - name: Upload Evaluation Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-reports
          path: |
            results.json
            fault_report.json
            failure_report.json
            evaluation_summary.json
